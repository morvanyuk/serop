{% extends "navbar.html" %}
{% block style %}<link rel="stylesheet" href="/static/menu.css">{% endblock %}
{% block body %}

<div id="button-container">
  <button class="btn btn-success mb-3" data-bs-toggle="modal" data-bs-target="#itemModal">➕ Додати граф</button>
</div>

<div class="modal fade" id="itemModal" tabindex="-1" aria-labelledby="itemModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <form id="itemForm" class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="itemModalLabel">Додати предмет</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрити"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="itemId">
        <div class="mb-3">
          <label for="itemName" class="form-label">Назва</label>
          <input type="text" pattern="[A-Za-z0-9]+" class="form-control" id="itemName" required>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Скасувати</button>
        <button type="submit" onclick="create_graph(event)" class="btn btn-primary">Зберегти</button>
      </div>
    </form>
  </div>
</div>

  <table class="table table-dark">
    <thead>
      <tr>
        <th scope="col">#</th>
        <th scope="col"></th>
        <!-- <th scope="col"></th> -->
      </tr>
    </thead>
    <tbody id="tbody">
    </tbody>
  </table>
{% endblock %}


{% block script %}<script src="/static/menu.js"></script>{% endblock %}
